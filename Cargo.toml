[package]
name = "rho"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util", "fs"] }
open = "5"
regex = "1"
notify = "6"
libunftp = "0.23"
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"
rand = "0.8"
sysinfo = "0.32"

[dev-dependencies]
tempfile = "3"
